use_default_settings:
  engines:
    keep_only: [wikipedia, wiby]

general:
  contact_url: "https://github.com/AndrewSnusoed5/rustxng-research-mcp"

server:
  bind_address: "127.0.0.1"
  secret_key: "local-http-benchmark-only"
  limiter: false
  public_instance: false

search:
  formats: [json]
  safe_search: 0

outgoing:
  request_timeout: 4.0
  max_request_timeout: 5.0

valkey:
  url: false

engines:
  - name: wikipedia
    display_type: [list]
  - name: wiby
    disabled: false
