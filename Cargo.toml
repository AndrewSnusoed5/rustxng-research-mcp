[package]
name = "rustxng-research-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A lightweight MCP server for self-hosted RustXNG web search and page text"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/AndrewSnusoed5/rustxng-research-mcp"
readme = "README.md"
keywords = ["mcp", "rustxng", "metasearch", "web-search", "research"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "=3.11.0", features = ["transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = "thin"
